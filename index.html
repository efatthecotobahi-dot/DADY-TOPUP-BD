<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DADY SHOP - Top Up BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f1f5ff;padding-bottom:110px}
.head{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;color:#0f52bd}
.logo span{color:#ff6a00}
.headRight{display:flex;align-items:center;gap:8px}
.walletBtn{background:#0f52bd;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-weight:700}
.loginBtn{background:#0f52bd;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700}
.top{padding:14px 12px;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.card{background:#fff;border-radius:15px;overflow:hidden;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.card p{padding:12px;font-weight:700;font-size:15px}
.box{background:#fff;border-radius:15px;padding:14px;margin:14px 12px 0}
.box h3{margin-bottom:10px}
.pkgGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.pkg b{font-size:13px}
.pkg span{color:#ff6a00;font-weight:800;display:block;margin-top:4px}
.pkg.sel{border:2px solid #0f52bd;background:#eef4ff}
.input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:10px;margin-top:10px;font-size:15px;outline:none}
.btnBlue{width:100%;background:#0f52bd;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:16px;margin-top:12px}
.btnGreen{width:100%;background:#00a651;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:16px;margin-top:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #eee}
.bottom div{text-align:center;font-size:12px;font-weight:700;color:#555}
</style>
</head>
<body>

<div class="head">
<div class="logo">DADY <span>SHOP</span></div>
<div class="headRight">
<button class="walletBtn">৳ 0.00</button>
<button class="loginBtn">Login</button>
</div>
</div>

<div class="top">Top Up Game</div>

<div class="grid">
<div class="card" onclick="selectGame('Free Fire')"><img src="freefire.jpg"><p>Free Fire</p></div>
<div class="card" onclick="selectGame('PUBG Mobile')"><img src="pubg.jpg"><p>PUBG Mobile</p></div>
<div class="card" onclick="selectGame('Free Fire MAX')"><img src="freefiremax.jpg"><p>Free Fire MAX</p></div>
<div class="card" onclick="selectGame('Call of Duty')"><img src="cod.jpg"><p>Call of Duty</p></div>
</div>

<div class="box">
<h3 id="gameTitle">Free Fire - Package Select</h3>
<div class="pkgGrid" id="pkgList"></div>
<input class="input" id="uid" placeholder="Player UID / ID Number">
<input class="input" id="phone" placeholder="WhatsApp / bKash Number">
<button class="btnBlue" onclick="buyNow()">Buy Now</button>
<button class="btnGreen" onclick="buyWhatsApp()">WhatsApp Order</button>
</div>

<div class="bottom">
<div>🏠<br>Home</div>
<div>💎<br>Top Up</div>
<div>📦<br>Orders</div>
<div>👤<br>Account</div>
</div>

<script>
let packages = [
{name:"100 Diamond", price:"85 ৳"},
{name:"310 Diamond", price:"250 ৳"},
{name:"520 Diamond", price:"410 ৳"},
{name:"1060 Diamond", price:"820 ৳"},
{name:"2180 Diamond", price:"1650 ৳"},
{name:"Weekly Membership", price:"180 ৳"},
];
let selected = 0;
function renderPkg(){
let h="";
packages.forEach((p,i)=>{
h+=`<div class="pkg ${i==selected?'sel':''}" onclick="pickPkg(${i})"><b>${p.name}</b><span>${p.price}</span></div>`;
});
document.getElementById("pkgList").innerHTML=h;
}
function pickPkg(i){selected=i;renderPkg();}
function selectGame(g){document.getElementById("gameTitle").innerText=g+" - Package Select";}
function buyNow(){alert("Order: "+packages[selected].name+" | UID: "+document.getElementById("uid").value);}
function buyWhatsApp(){
let msg="Hello DADY SHOP, I want "+packages[selected].name+" ("+packages[selected].price+") UID: "+document.getElementById("uid").value;
window.open("https://wa.me/8801705780185?text="+encodeURIComponent(msg));
}
renderPkg();
</script>
</body>
</html>
